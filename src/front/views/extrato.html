<!-- EXTRATO COMPLETO (ALUNO) -->
<section class="screen" id="extrato">
  <div class="section-title" style="margin-top:0;">
    <h2>Extrato completo</h2>
    <span class="muted" id="extrato-resumo"></span>
  </div>
  <div class="card" style="margin-bottom:18px;">
    <form id="extrato-filtro" style="display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end;" onsubmit="return false;">
      <div class="field" style="flex:1; min-width:160px;">
        <label>Tipo</label>
        <select id="extrato-tipo">
          <option value="todas">Todas as transações</option>
          <option value="recebimentos">Recebimentos</option>
          <option value="resgates">Resgates</option>
        </select>
      </div>
      <button class="cta ghost" type="button" style="height:39px;" onclick="renderExtrato()">Filtrar</button>
    </form>
  </div>
  <div class="card">
    <div class="timeline" id="extrato-lista"></div>
  </div>
</section>
