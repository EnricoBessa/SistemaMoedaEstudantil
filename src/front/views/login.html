<!-- LOGIN -->
<section class="screen" id="login" style="position:relative; min-height:560px;">
  <div class="falling-coins">
    <svg width="26" height="26" style="left:4%; animation-duration:3.2s; animation-delay:0s;"><use href="#coin-icon"/></svg>
    <svg width="18" height="18" style="left:11%; animation-duration:2.4s; animation-delay:.6s;"><use href="#coin-icon"/></svg>
    <svg width="20" height="20" style="left:17%; animation-duration:3.8s; animation-delay:1.4s;"><use href="#coin-icon"/></svg>
    <svg width="18" height="18" style="left:83%; animation-duration:2.8s; animation-delay:.3s;"><use href="#coin-icon"/></svg>
    <svg width="28" height="28" style="left:90%; animation-duration:4.2s; animation-delay:1.6s;"><use href="#coin-icon"/></svg>
    <svg width="20" height="20" style="left:96%; animation-duration:3s; animation-delay:.9s;"><use href="#coin-icon"/></svg>
  </div>
  <div class="login-wrap">
    <div class="login-card">
      <svg class="coin bounce" width="68" height="68" style="margin-bottom:14px;"><use href="#coin-icon"/></svg>
      <h2 style="margin:0 0 4px;">Entrar</h2>
      <p class="muted" style="margin:0 0 18px;">Acesse com o e-mail cadastrado pela sua instituição</p>
      <div class="roles" id="login-roles">
        <button class="active" data-role="ALUNO">Aluno</button>
        <button data-role="PROFESSOR">Professor</button>
        <button data-role="EMPRESA">Empresa parceira</button>
      </div>
      <form id="login-form">
        <p class="error-msg" id="login-error" style="display:none;"></p>
        <div class="field"><label>E-mail</label><input type="email" id="login-email" placeholder="voce@instituicao.edu.br" required></div>
        <div class="field"><label>Senha</label><input type="password" id="login-senha" placeholder="••••••••" required></div>
      </form>
      <button class="cta" id="login-submit" style="width:100%; padding:12px;">Entrar</button>
      <p class="hint">Novo aluno? <b><a href="#" onclick="showScreen('cadastro-aluno'); return false;">Criar cadastro</a></b> · Empresa parceira? <b><a href="#" onclick="showScreen('cadastro-empresa'); return false;">Cadastre-se aqui</a></b></p>
      <p class="hint" style="margin-top:8px;">Demo: aluno <code>camila.duarte@puc.br</code>, professor <code>ricardo.alves@puc.br</code>, empresa <code>contato@ru.com.br</code> — senha <code>123456</code> para todos.</p>
    </div>
  </div>
</section>
