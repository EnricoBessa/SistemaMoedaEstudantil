<!-- CONFIRMAÇÃO DE RESGATE (ALUNO) -->
<section class="screen" id="confirmacao">
  <div style="min-height:460px; background:rgba(31,16,51,.55); border-radius:var(--radius); display:flex; align-items:center; justify-content:center; padding:24px;">
    <div class="card" style="max-width:380px; text-align:center; box-shadow:0 24px 48px rgba(0,0,0,.25);">
      <div style="font-size:40px; margin-bottom:6px;">🎉</div>
      <h3 style="font-size:18px;">Vantagem resgatada!</h3>
      <p class="muted" id="confirmacao-descricao"></p>
      <div class="coupon" style="margin:18px 0; justify-content:center; flex-direction:column; gap:6px;">
        <div style="font-size:12px; color:var(--ink-soft);">Apresente este código no balcão</div>
        <code id="confirmacao-codigo" style="font-size:22px;"></code>
      </div>
      <p class="muted" style="font-size:12px;">Um e-mail de confirmação também seria enviado para você e para a empresa parceira (envio de e-mail não implementado nesta versão).</p>
      <button class="cta" style="width:100%; padding:12px; margin-top:8px;" onclick="showScreen('aluno')">Voltar para a loja</button>
    </div>
  </div>
</section>
