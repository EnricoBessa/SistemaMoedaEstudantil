<!-- MEU PERFIL (ALUNO) -->
<section class="screen" id="perfil">
  <div class="hud">
    <div>
      <div class="who">Meu perfil</div>
      <div class="name" id="perfil-nome-topo">Carregando...</div>
    </div>
    <div class="balance">
      <div class="balance-row">
        <svg class="coin" width="30" height="30"><use href="#coin-icon"/></svg>
        <div class="num" id="perfil-saldo">0</div>
      </div>
      <div class="label">moedas disponíveis</div>
    </div>
  </div>
  <div class="card" style="max-width:640px;">
    <h3>Editar meus dados</h3>
    <p class="muted">CPF não pode ser alterado</p>
    <form id="perfil-form">
      <p class="error-msg" id="perfil-error" style="display:none;"></p>
      <p class="success-msg" id="perfil-sucesso" style="display:none;"></p>
      <div class="grid cols-2" style="gap:14px;">
        <div class="field"><label>Nome completo</label><input id="perfil-nome"></div>
        <div class="field"><label>CPF</label><input id="perfil-cpf" disabled style="opacity:.6;"></div>
        <div class="field"><label>E-mail</label><input type="email" id="perfil-email"></div>
        <div class="field"><label>Curso</label><input id="perfil-curso"></div>
      </div>
      <div class="field"><label>Endereço</label><input id="perfil-endereco"></div>
    </form>
    <button class="cta" id="perfil-submit">Salvar alterações</button>
  </div>
</section>
