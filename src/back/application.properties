spring.application.name=sistema-moeda-estudantil
server.port=8080

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:moedaestudantil}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:moedaestudantil}
spring.datasource.password=${DB_PASSWORD:moedaestudantil}

# O schema agora é versionado pelo Flyway (ver src/back/db/migration); o Hibernate
# só valida que as entidades batem com as tabelas, nunca altera o schema sozinho.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.locations=classpath:db/migration

security.jwt.secret=${JWT_SECRET:change-this-secret-change-this-secret-change-this-secret}
security.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:120}

# E-mail (SMTP) - configure as variáveis de ambiente em produção.
# Para testar localmente sem um provedor real, use o Mailtrap (sandbox gratuito):
# cadastre-se em mailtrap.io, copie host/porta/usuário/senha da sua inbox de testes.
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.remetente=${MAIL_FROM:nao-responda@sistemamoedaestudantil.com}

# Upload de foto de perfil (avatar): arquivos ficam em disco local (ou volume montado
# em produção) e são servidos como recurso estático em /uploads/**.
app.upload.diretorio=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Login/cadastro com Google (Google Identity Services). Crie um OAuth Client ID
# "Web application" no Google Cloud Console e cadastre a origem do site em
# "Authorized JavaScript origins" (ex.: http://localhost:8080 e a URL do Render).
app.google.client-id=${GOOGLE_CLIENT_ID:}
