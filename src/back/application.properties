spring.application.name=sistema-moeda-estudantil
server.port=8080

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:moedaestudantil}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:moedaestudantil}
spring.datasource.password=${DB_PASSWORD:moedaestudantil}

# O schema agora é versionado pelo Flyway (ver src/back/db/migration); o Hibernate
# só valida que as entidades batem com as tabelas, nunca altera o schema sozinho.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.locations=classpath:db/migration

security.jwt.secret=${JWT_SECRET:change-this-secret-change-this-secret-change-this-secret}
security.jwt.expiracao-minutos=${JWT_EXPIRACAO_MINUTOS:120}
